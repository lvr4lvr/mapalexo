<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapalexo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #FFF3E5; color: #000; font-family: sans-serif; padding: 40px; }
    .card { max-width: 400px; margin: auto; background: #fff; padding: 20px; border: 2px solid #000; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; }
    button { background: #CC5500; color: #fff; font-weight: bold; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="auth-title">Iniciar sesión</h2>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Correo" required>
      <input type="password" id="auth-password" placeholder="Contraseña" required>
      <button type="submit" id="btn-auth-submit">Entrar</button>
      <button type="button" id="btn-toggle-auth" style="background:#444;">¿No tienes cuenta? Regístrate</button>
    </form>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
